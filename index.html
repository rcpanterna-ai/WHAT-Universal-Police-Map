<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHAT Universal Police Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
    background: #000;
}

#map-layer-switcher {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 1100;
    display: flex;
    gap: 6px;
    padding: 5px;
    background: rgba(0, 0, 0, .78);
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 8px;
}

#map-layer-switcher button {
    padding: 9px 12px;
    border: 1px solid rgba(255, 255, 255, .45);
    border-radius: 5px;
    background: #20252b;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

#map-layer-switcher button.active {
    background: #1769aa;
    border-color: #8ed0ff;
}

#map-layer-switcher button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
}

#title {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    padding: 8px 18px;
    background: rgba(0, 0, 0, .75);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    border: 1px solid rgba(255, 255, 255, .4);
    border-radius: 6px;
    text-shadow: 0 0 5px #000, 0 0 10px #000;
    white-space: nowrap;
}

/* กล่องแสดงพิกัด */
#mouse-coordinates,
#clicked-coordinates {
    position: absolute;
    right: 15px;
    z-index: 1000;
    padding: 8px 12px;
    background: rgba(0, 0, 0, .75);
    color: #fff;
    font-size: 14px;
    border-radius: 5px;
    border: 1px solid rgba(255, 255, 255, .35);
    line-height: 1.5;
}

#mouse-coordinates {
    top: 15px;
}

#clicked-coordinates {
    top: 75px;
}

/* NA: กรอบไอคอน 24 x 24 px */
.marker-na {
    display: block;
    width: 16px;
    height: 16px;
}

/* เก็บรูปแบบ SVG สำหรับไอคอนหมวดหมู่ในอนาคต */
.category-svg {
    display: block;
    width: 22px;
    height: 22px;
    overflow: visible;
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, 1));
}

/* ชื่อสถานที่เมื่อชี้เมาส์ */
.leaflet-tooltip {
    background: rgba(0, 0, 0, .85);
    color: #fff;
    border: 1px solid #fff;
    border-radius: 6px;
    padding: 5px 10px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.3;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .8);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
}

.leaflet-tooltip-top:before {
    border-top-color: #fff;
}

@media (max-width: 600px) {
    #map-layer-switcher {
        top: 10px;
        left: 8px;
        gap: 4px;
        padding: 4px;
    }

    #map-layer-switcher button {
        padding: 7px 8px;
        font-size: 11px;

    #title {
        top: 10px;
        font-size: 15px;
        letter-spacing: 1px;
        padding: 7px 10px;
    }

    #mouse-coordinates,
    #clicked-coordinates {
        right: 8px;
        font-size: 12px;
        padding: 6px 8px;
    }

    #mouse-coordinates {
        top: 60px;
    }

    #clicked-coordinates {
        top: 118px;
    }

</head>

<body>

<div id="map-layer-switcher" role="group" aria-label="เลือกเลเยอร์แผนที่">
    <button id="satellite-button" class="active" type="button" aria-pressed="true">Satellite Map</button>
    <button id="atlas-button" type="button" aria-pressed="false">Atlas Map</button>
</div>
<div id="title">WHAT Universal Police Map</div>
<div id="mouse-coordinates">X: 0<br>Y: 0</div>
<div id="clicked-coordinates">Click X: -<br>Click Y: -</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================
   1. ตั้งค่าขนาดแผนที่
========================================= */

const mapWidth = 8192;
const mapHeight = 8192;

const bounds = [
    [0, 0],
    [mapHeight, mapWidth]
];

/* =========================================
   2. สร้างแผนที่
========================================= */

const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -5,
    maxZoom: 2,
    zoomControl: true,
    attributionControl: false
});

// ภาพทั้งสองใช้ bounds เดียวกัน เพื่อคงระบบพิกัดเดิม
const satelliteLayer = L.imageOverlay('./SHANE%20MAP%20REPORT.jpg', bounds);
const atlasLayer = L.imageOverlay('./SHANE%20MAP%20ATLAS.png', bounds);

// เริ่มต้นด้วย Satellite Map เหมือนเว็บไซต์เดิม
satelliteLayer.addTo(map);

const satelliteButton = document.getElementById('satellite-button');
const atlasButton = document.getElementById('atlas-button');

function setMapLayer(layerName) {
    const currentCenter = map.getCenter();
    const currentZoom = map.getZoom();

    if (layerName === 'atlas') {
        if (map.hasLayer(satelliteLayer)) map.removeLayer(satelliteLayer);
        if (!map.hasLayer(atlasLayer)) atlasLayer.addTo(map);
        atlasButton.classList.add('active');
        atlasButton.setAttribute('aria-pressed', 'true');
        satelliteButton.classList.remove('active');
        satelliteButton.setAttribute('aria-pressed', 'false');
    } else {
        if (map.hasLayer(atlasLayer)) map.removeLayer(atlasLayer);
        if (!map.hasLayer(satelliteLayer)) satelliteLayer.addTo(map);
        satelliteButton.classList.add('active');
        satelliteButton.setAttribute('aria-pressed', 'true');
        atlasButton.classList.remove('active');
        atlasButton.setAttribute('aria-pressed', 'false');
    }

    // รักษาจุดกึ่งกลางและระดับซูมเดิมเมื่อสลับเลเยอร์
    map.setView(currentCenter, currentZoom, { animate: false });
}

satelliteButton.addEventListener('click', () => setMapLayer('satellite'));
atlasButton.addEventListener('click', () => setMapLayer('atlas'));

map.setView([4096, 4096], -2);
map.setMaxBounds(bounds);

function createBasicCategoryIcon(category) {
    const icons = {
        NA: { color: '#222222', shape: 'pin' },
        B:  { color: '#0057FF', shape: 'pin' },
        S:  { color: '#ffdf00', shape: 'star' },
        A0: { color: '#ffdf00', shape: 'diamond' }
    };

    const item = icons[category];

    if (!item) {
        return createNaIcon();
    }

    let shape = '';

    if (item.shape === 'pin') {
        shape = `
            <path
                d="M24 3
                C14 3 8 10 8 19
                C8 29 24 45 24 45
                C24 45 40 29 40 19
                C40 10 34 3 24 3 Z"
                fill="${item.color}"
                stroke="#ffffff"
                stroke-width="2.5"/>

            <circle
                cx="24" cy="18"
                r="3"
                fill="#ffffff"/>
        `;
    } else if (item.shape === 'star') {
        shape = `
            <polygon
                points="24,3 29,17 44,17 32,26
                36,41 24,32 12,41 16,26 4,17 19,17"
                fill="${item.color}"
                stroke="#333333"
                stroke-width="2"/>
        `;
    } else if (item.shape === 'diamond') {
        shape = `
            <polygon
                points="24,3 43,24 24,45 5,24"
                fill="${item.color}"
                stroke="#333333"
                stroke-width="2"/>
        `;
    }

    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 48 48">
            ${shape}
        </svg>
    `;

    return L.divIcon({
        className: '',
        html: svg,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });
}

/* =========================================
   9. โหลดข้อมูลสถานที่
   ไม่แก้ไขชื่อหรือพิกัดใน locations.json
========================================= */

fetch('locations.json')
    .then(response => {
        if (!response.ok) {
            throw new Error(
                'ไม่สามารถโหลด locations.json ได้'
            );
        }

        return response.json();
    })
    .then(locations => {
        if (!Array.isArray(locations)) {
            throw new Error(
                'รูปแบบ locations.json ต้องเป็น Array'
            );
        }

        let validCount = 0;
        let invalidCount = 0;

        locations.forEach((location, index) => {
            if (
                !location ||
                typeof location.name !== 'string' ||
                location.name.trim() === '' ||
                typeof location.x !== 'number' ||
                !Number.isFinite(location.x) ||
                typeof location.y !== 'number' ||
                !Number.isFinite(location.y)
            ) {
                console.warn(
                    `ข้อมูลสถานที่ลำดับที่ ${index + 1} ไม่ถูกต้อง:`,
                    location
                );

                invalidCount++;
                return;
            }

            const category =
                typeof location.category === 'string' &&
                location.category.trim() !== ''
                    ? location.category.trim().toUpperCase()
                    : 'NA';

            const leafletX = location.x;
            const leafletY = mapHeight - location.y;

            const marker = L.marker(
                [leafletY, leafletX],
                {
                    icon: createLocationIcon(category)
                }
            ).addTo(map);

            /* ชี้เมาส์เพื่อแสดงชื่อสถานที่ */
            marker.bindTooltip(location.name, {
                direction: 'top',
                offset: [0, -8],
                opacity: 0.95
            });

            validCount++;
        });

        console.info(
            `โหลดสถานที่สำเร็จ ${validCount} จุด; ` +
            `ข้อมูลไม่ถูกต้อง ${invalidCount} จุด`
        );
    })
    .catch(error => {
        console.error(error);

        alert(
            'ไม่สามารถโหลด locations.json ได้ ' +
            'กรุณาตรวจสอบว่าไฟล์อยู่ในโฟลเดอร์เดียวกับ index.html ' +
            'และเปิดผ่าน Live Server'
        );
    });

========================================= */

map.on('mousemove', function(event) {
    const x = Math.round(event.latlng.lng);
    const y = Math.round(mapHeight - event.latlng.lat);

    document.getElementById(
        'mouse-coordinates'
    ).innerHTML = `X: ${x}<br>Y: ${y}`;
});

    const y = Math.round(mapHeight - event.latlng.lat);

    document.getElementById(
        'clicked-coordinates'
